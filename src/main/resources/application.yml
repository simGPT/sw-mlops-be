spring:
  application:
    name: sw-mlops-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sw_mlops_shopping_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:sw-mlops-be-jwt-secret-key-for-local-dev-must-be-long-enough}
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 604800
  secure: ${COOKIE_SECURE:false}
  same-site: None

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET:sw-mlops-be-bucket}
      region: ${S3_REGION:ap-northeast-2}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

model:
  api:
    url: ${MODEL_API_URL:https://model.swmlops.site}

ses:
  sender: ${SES_SENDER:support@swmlops.site}
